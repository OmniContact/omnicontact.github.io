<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unitree G1 Motion Viewer</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f4f5f7;
            color: #1f2933;
            overflow: hidden;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #loading {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.92);
            z-index: 20;
            font-size: 0;
            font-weight: 700;
        }

        #loading::after {
            width: 30px;
            height: 30px;
            border: 3px solid rgba(37, 99, 235, 0.18);
            border-top-color: #2563eb;
            border-radius: 50%;
            content: "";
            animation: spin 0.8s linear infinite;
        }

        #loading.has-message {
            font-size: 14px;
        }

        #loading.has-message::after {
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #controls {
            position: absolute;
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%);
            width: min(620px, calc(100vw - 36px));
            padding: 14px;
            background: rgba(17, 24, 39, 0.88);
            border-radius: 8px;
            box-shadow: 0 12px 34px rgba(0, 0, 0, 0.22);
            z-index: 10;
        }

        #timeline-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #timeline-slider {
            flex: 1;
            min-width: 0;
            accent-color: #3b82f6;
        }

        #time-display {
            width: 106px;
            color: #e5e7eb;
            font: 600 12px/1.2 "Courier New", monospace;
            text-align: right;
        }

        #button-row {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 10px;
        }

        button {
            border: 0;
            border-radius: 6px;
            padding: 8px 13px;
            font-size: 13px;
            font-weight: 700;
            color: #f8fafc;
            background: #2563eb;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

    </style>
</head>
<body>
    <div id="canvas-container">
        <div id="loading"></div>
        <div id="controls">
            <div id="timeline-row">
                <input type="range" id="timeline-slider" min="0" max="1000" value="0" step="1">
                <div id="time-display">0.00s / 0.00s</div>
            </div>
            <div id="button-row">
                <button id="play-btn">Play</button>
                <button id="pause-btn">Pause</button>
                <button id="restart-btn">Restart</button>
            </div>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "./static/vendor/three/build/three.module.js",
            "three/addons/": "./static/vendor/three/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const container = document.getElementById('canvas-container');
        const loading = document.getElementById('loading');
        const timelineSlider = document.getElementById('timeline-slider');
        const timeDisplay = document.getElementById('time-display');
        const manifestUrl = 'static/glb/manifest.json';
        const glbBaseUrl = 'static/glb/';
        const urlParams = new URLSearchParams(window.location.search);
        const requestedGroup = urlParams.get('group');
        const requestedCamera = urlParams.get('camera');

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf7f8fa);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.01, 500);
        camera.position.set(4.2, 2.4, 4.2);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.shadowMap.enabled = false;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0.3, 0.8, 0.0);

        scene.add(new THREE.HemisphereLight(0xffffff, 0x8a9099, 0.85));

        const keyLight = new THREE.DirectionalLight(0xffffff, 0.25);
        keyLight.position.set(4, 8, 3);
        keyLight.castShadow = false;
        scene.add(keyLight);

        const groundTexture = makeCheckerTexture();
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(30, 30),
            new THREE.MeshStandardMaterial({ map: groundTexture, roughness: 0.85 })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = false;
        scene.add(ground);

        let mixer = null;
        let actions = [];
        let currentModel = null;
        let contactShadows = [];
        let duration = 0;
        let playbackTime = 0;
        let isPlaying = true;
        let isScrubbing = false;
        const clock = new THREE.Clock();
        const visualPalette = {
            red: new THREE.Color(0xf26a5b),
            green: new THREE.Color(0x33b982),
            blue: new THREE.Color(0x3f8fd8),
            yellow: new THREE.Color(0xe4bf3f),
            neutral: new THREE.Color(0x7c8ea3)
        };

        const loader = new GLTFLoader();

        fetch(manifestUrl)
            .then((response) => {
                if (!response.ok) throw new Error(`Cannot load ${manifestUrl}`);
                return response.json();
            })
            .then((manifest) => {
                const items = getManifestItems(manifest);
                if (items.length === 0) {
                    throw new Error('Manifest has no motion items.');
                }
                renderSequenceList(items);
                loadMotion(items[0], 0);
            })
            .catch((error) => {
                loading.classList.add('has-message');
                loading.textContent = 'Failed to load motion manifest.';
                console.error(error);
            });

        timelineSlider.addEventListener('input', (event) => {
            if (!mixer || actions.length === 0 || duration <= 0) return;
            isScrubbing = true;
            const targetTime = (Number(event.target.value) / 1000) * duration;
            setAnimationTime(targetTime);
            updateTimeDisplay(targetTime);
            renderer.render(scene, camera);
        });

        timelineSlider.addEventListener('change', () => {
            isScrubbing = false;
            clock.getDelta();
        });

        document.getElementById('play-btn').addEventListener('click', () => {
            isPlaying = true;
            clock.getDelta();
        });

        document.getElementById('pause-btn').addEventListener('click', () => {
            isPlaying = false;
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            if (!mixer || actions.length === 0) return;
            setAnimationTime(0);
            timelineSlider.value = 0;
            updateTimeDisplay(0);
            isPlaying = true;
            clock.getDelta();
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            if (mixer && isPlaying && !isScrubbing) {
                const delta = clock.getDelta();
                mixer.update(delta);
                if (actions.length > 0 && duration > 0) {
                    playbackTime = (playbackTime + delta) % duration;
                    timelineSlider.value = String((playbackTime / duration) * 1000);
                    updateTimeDisplay(playbackTime);
                }
            } else {
                clock.getDelta();
            }
            controls.update();
            updateContactShadows();
            renderer.render(scene, camera);
        }

        function updateTimeDisplay(currentTime) {
            timeDisplay.textContent = `${currentTime.toFixed(2)}s / ${duration.toFixed(2)}s`;
        }

        function renderSequenceList(items) {
            const sequenceList = document.getElementById('sequence-list');
            if (!sequenceList) return;
            sequenceList.innerHTML = '';
            items.forEach((item, index) => {
                const button = document.createElement('button');
                button.className = 'sequence-btn';
                button.textContent = item.title || item.id || item.file;
                button.addEventListener('click', () => loadMotion(item, index));
                sequenceList.appendChild(button);
            });
        }

        function getManifestItems(manifest) {
            if (requestedGroup && manifest.groups && Array.isArray(manifest.groups[requestedGroup])) {
                return manifest.groups[requestedGroup];
            }
            if (requestedGroup) {
                return (manifest.items || []).filter((item) => item.group === requestedGroup);
            }
            return manifest.items || [];
        }

        function setActiveSequence(index) {
            const sequenceList = document.getElementById('sequence-list');
            if (!sequenceList) return;
            [...sequenceList.querySelectorAll('.sequence-btn')].forEach((button, buttonIndex) => {
                button.classList.toggle('active', buttonIndex === index);
            });
        }

        function loadMotion(item, index) {
            loading.classList.remove('has-message');
            loading.textContent = '';
            loading.style.display = 'flex';
            setActiveSequence(index);
            resetAnimationState();
            if (currentModel) {
                scene.remove(currentModel);
                disposeObject(currentModel);
                currentModel = null;
            }

            loader.load(
                `${glbBaseUrl}${item.file}?v=${encodeURIComponent(item.source || item.file)}`,
                (gltf) => {
                    const model = gltf.scene;
                    model.traverse((child) => {
                        if (child.isMesh) {
                            child.castShadow = false;
                            child.receiveShadow = false;
                        }
                    });
                    polishVisualizationColors(model);
                    currentModel = model;
                    scene.add(model);
                    setupContactShadows(model);

                    if (gltf.animations.length > 0) {
                        mixer = new THREE.AnimationMixer(model);
                        actions = gltf.animations.map((clip) => {
                            const clipAction = mixer.clipAction(clip);
                            clipAction.play();
                            return clipAction;
                        });
                        duration = Math.max(...gltf.animations.map((clip) => clip.duration));
                        setAnimationTime(0);
                    }

                    updateTimeDisplay(0);
                    fitCameraToObject(model);
                    loading.style.display = 'none';
                    isPlaying = true;
                    clock.getDelta();
                },
                undefined,
                (error) => {
                    loading.classList.add('has-message');
                    loading.textContent = `Failed to load ${item.file}`;
                    console.error(error);
                }
            );
        }

        function resetAnimationState() {
            actions.forEach((clipAction) => clipAction.stop());
            if (mixer) mixer.stopAllAction();
            mixer = null;
            actions = [];
            clearContactShadows();
            duration = 0;
            playbackTime = 0;
            timelineSlider.value = 0;
            updateTimeDisplay(0);
        }

        function setAnimationTime(time) {
            playbackTime = duration > 0 ? Math.max(0, Math.min(time, duration)) : 0;
            actions.forEach((clipAction) => {
                clipAction.time = Math.min(playbackTime, clipAction.getClip().duration);
            });
            if (mixer) mixer.update(0);
            updateContactShadows();
        }

        function setupContactShadows(model) {
            clearContactShadows();
            const shadowTexture = makeContactShadowTexture();
            const worldBox = new THREE.Box3();
            const worldSize = new THREE.Vector3();

            model.traverse((child) => {
                if (!child.isMesh || isVisualOverlayObject(child)) return;
                const isBox = isBoxObject(child);
                const isRobotAnchor = /(^|_)pelvis($|_)/i.test(child.name || '');
                if (!isBox && !isRobotAnchor) return;

                worldBox.setFromObject(child);
                worldBox.getSize(worldSize);
                const radius = isBox ? Math.max(0.38, Math.max(worldSize.x, worldSize.z) * 1.18) : 0.74;
                const material = new THREE.MeshBasicMaterial({
                    map: shadowTexture,
                    transparent: true,
                    opacity: isBox ? 0.11 : 0.13,
                    depthWrite: false,
                    depthTest: true
                });
                const shadow = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), material);
                shadow.rotation.x = -Math.PI / 2;
                shadow.renderOrder = 1;
                shadow.userData.target = child;
                shadow.userData.radius = radius;
                shadow.userData.baseOpacity = material.opacity;
                shadow.userData.isRobotAnchor = isRobotAnchor;
                shadow.scale.set(radius, radius, 1);
                scene.add(shadow);
                contactShadows.push(shadow);
            });

            updateContactShadows();
        }

        function updateContactShadows() {
            if (contactShadows.length === 0) return;
            const position = new THREE.Vector3();
            contactShadows.forEach((shadow) => {
                const target = shadow.userData.target;
                if (!target) return;
                target.getWorldPosition(position);
                shadow.position.set(position.x, 0.012, position.z);
                const heightFactor = THREE.MathUtils.clamp(1.0 - position.y * 0.48, 0.24, 1.0);
                const scaleFactor = shadow.userData.isRobotAnchor
                    ? 1.0
                    : THREE.MathUtils.clamp(1.0 + position.y * 0.16, 1.0, 1.24);
                shadow.scale.set(
                    shadow.userData.radius * scaleFactor,
                    shadow.userData.radius * scaleFactor,
                    1
                );
                shadow.material.opacity = shadow.userData.baseOpacity * heightFactor;
            });
        }

        function clearContactShadows() {
            contactShadows.forEach((shadow) => {
                scene.remove(shadow);
                if (shadow.geometry) shadow.geometry.dispose();
                if (shadow.material) shadow.material.dispose();
            });
            contactShadows = [];
        }

        function polishVisualizationColors(model) {
            model.traverse((child) => {
                if (!child.isMesh || (!isPropObject(child) && !isVisualOverlayObject(child))) return;
                child.receiveShadow = false;
                child.castShadow = false;
                const materials = Array.isArray(child.material) ? child.material : [child.material];
                const polishedMaterials = materials.map((material) => {
                    if (!material) return material;
                    const clone = material.clone();
                    const color = isPropObject(child) && clone.color ? clone.color.clone() : pickPolishedColor(clone.color);
                    if (clone.color) clone.color.copy(color);
                    if (clone.emissive && clone.color) {
                        clone.emissive.copy(color).multiplyScalar(isVisualOverlayObject(child) ? 0.38 : 0.22);
                        clone.emissiveIntensity = isVisualOverlayObject(child) ? 0.9 : 0.65;
                    }
                    if (isVisualOverlayObject(child)) {
                        clone.transparent = true;
                        clone.opacity = 0.96;
                    }
                    if (isPropObject(child)) {
                        clone.transparent = false;
                        clone.opacity = 1.0;
                        clone.alphaMap = null;
                        clone.side = THREE.DoubleSide;
                        clone.depthWrite = true;
                        clone.depthTest = true;
                        clone.alphaTest = 0;
                    }
                    clone.metalness = 0.0;
                    clone.needsUpdate = true;
                    return clone;
                });
                child.material = Array.isArray(child.material) ? polishedMaterials : polishedMaterials[0];
            });
        }

        function pickPolishedColor(color) {
            if (!color) return visualPalette.neutral.clone();
            const { r, g, b } = color;
            if (r > 0.55 && g > 0.45 && b < 0.35) return visualPalette.yellow.clone();
            if (g >= r && g >= b) return visualPalette.green.clone();
            if (b >= r && b >= g) return visualPalette.blue.clone();
            if (r >= g && r >= b) return visualPalette.red.clone();
            return visualPalette.neutral.clone();
        }

        function isBoxObject(object) {
            const names = [
                object.name || '',
                object.parent?.name || '',
                object.material?.name || '',
                ...(Array.isArray(object.material) ? object.material.map((material) => material?.name || '') : [])
            ].join(' ').toLowerCase();
            return /(^|[_\s])box($|[_\s\d])/.test(names) || names.includes('carrybox') || names.includes('object_box');
        }

        function isBallObject(object) {
            const names = [
                object.name || '',
                object.parent?.name || '',
                object.material?.name || '',
                ...(Array.isArray(object.material) ? object.material.map((material) => material?.name || '') : [])
            ].join(' ').toLowerCase();
            return names.includes('soccer') || names.includes('ball');
        }

        function isPropObject(object) {
            return isBoxObject(object) || isBallObject(object);
        }

        function isVisualOverlayObject(object) {
            const names = [
                object.name || '',
                object.parent?.name || '',
                object.material?.name || '',
                ...(Array.isArray(object.material) ? object.material.map((material) => material?.name || '') : [])
            ].join(' ').toLowerCase();
            return names.includes('visual_') || names.includes('seg_') || names.includes('trajectory') || names.includes('path');
        }

        function disposeObject(object) {
            object.traverse((child) => {
                if (!child.isMesh) return;
                if (child.geometry) child.geometry.dispose();
                const materials = Array.isArray(child.material) ? child.material : [child.material];
                materials.forEach((material) => {
                    if (!material) return;
                    Object.values(material).forEach((value) => {
                        if (value && value.isTexture) value.dispose();
                    });
                    material.dispose();
                });
            });
        }

        function fitCameraToObject(object) {
            const box = new THREE.Box3().setFromObject(object);
            const size = box.getSize(new THREE.Vector3());
            const center = box.getCenter(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            const distance = Math.max(2.45, maxDim * 1.42);
            controls.target.copy(center);
            controls.target.y = Math.max(center.y, 0.46);
            if (requestedCamera === 'vlm') {
                camera.position.set(center.x, center.y + distance * 0.56, center.z + distance * 0.48);
            } else {
                camera.position.set(center.x + distance, center.y + distance * 0.55, center.z + distance);
            }
            camera.near = Math.max(0.01, distance / 100);
            camera.far = distance * 100;
            camera.updateProjectionMatrix();
            controls.update();
        }

        function makeCheckerTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            for (let y = 0; y < 8; y++) {
                for (let x = 0; x < 8; x++) {
                    ctx.fillStyle = (x + y) % 2 === 0 ? '#f3f6f8' : '#e4eaf0';
                    ctx.fillRect(x * 16, y * 16, 16, 16);
                }
            }
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(14, 14);
            texture.colorSpace = THREE.SRGBColorSpace;
            return texture;
        }

        function makeContactShadowTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(64, 64, 4, 64, 64, 60);
            gradient.addColorStop(0.0, 'rgba(40, 55, 70, 0.28)');
            gradient.addColorStop(0.45, 'rgba(40, 55, 70, 0.13)');
            gradient.addColorStop(1.0, 'rgba(40, 55, 70, 0.0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 128, 128);
            const texture = new THREE.CanvasTexture(canvas);
            texture.colorSpace = THREE.SRGBColorSpace;
            return texture;
        }

        animate();
    </script>
</body>
</html>
