<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">OmniContact overview</title>
  <desc id="desc">Contact-flow synthesis, tracking, monitoring, and recovery loop.</desc>
  <defs>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ee6363"/>
    </linearGradient>
    <linearGradient id="surface" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="#f7f9fc"/>
  <path d="M0 0h1200v630H0z" fill="url(#surface)"/>
  <circle cx="970" cy="120" r="260" fill="#ee6363" opacity="0.08"/>
  <circle cx="170" cy="520" r="240" fill="#8b5cf6" opacity="0.08"/>
  <text x="90" y="108" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="800">OmniContact</text>
  <text x="94" y="152" fill="#5f6c7b" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="600">Chaining meta-skills via contact flow</text>
  <g filter="url(#shadow)">
    <rect x="96" y="236" width="270" height="160" rx="18" fill="#ffffff" stroke="#dce3ea"/>
    <rect x="96" y="236" width="7" height="160" rx="3.5" fill="url(#accent)"/>
    <text x="132" y="290" fill="#5f6c7b" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">Task Goal</text>
    <text x="132" y="334" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">CF-Gen</text>
    <text x="132" y="366" fill="#5f6c7b" font-family="Inter, Arial, sans-serif" font-size="17">synthesize contact flow</text>
    <rect x="465" y="236" width="270" height="160" rx="18" fill="#ffffff" stroke="#dce3ea"/>
    <rect x="465" y="236" width="7" height="160" rx="3.5" fill="url(#accent)"/>
    <text x="501" y="290" fill="#5f6c7b" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">Meta-skill Policy</text>
    <text x="501" y="334" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">CF-Track</text>
    <text x="501" y="366" fill="#5f6c7b" font-family="Inter, Arial, sans-serif" font-size="17">execute closed-loop</text>
    <rect x="834" y="236" width="270" height="160" rx="18" fill="#ffffff" stroke="#dce3ea"/>
    <rect x="834" y="236" width="7" height="160" rx="3.5" fill="url(#accent)"/>
    <text x="870" y="290" fill="#5f6c7b" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">Object State</text>
    <text x="870" y="334" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">Monitor</text>
    <text x="870" y="366" fill="#5f6c7b" font-family="Inter, Arial, sans-serif" font-size="17">detect, replan, resume</text>
  </g>
  <path d="M386 316h66" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
  <path d="M452 316l-16-10v20z" fill="#ee6363"/>
  <path d="M755 316h66" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
  <path d="M821 316l-16-10v20z" fill="#ee6363"/>
  <path d="M970 410c-150 92-400 100-600 10" fill="none" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 14" opacity="0.65"/>
  <text x="500" y="498" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="800">Contact-flow loop</text>
</svg>
